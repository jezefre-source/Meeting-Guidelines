<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101c3d"><title>Customer Meeting Guidelines</title><style>
:root{--ink:#17213b;--nav:#101c3d;--blue:#2856d8;--teal:#00a7a7;--paper:#f5f7fb;--line:#dbe2ee;--muted:#69758c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:90px}.hero{padding:calc(18px + env(safe-area-inset-top)) 18px 20px;background:linear-gradient(135deg,#101c3d,#2454b8);color:white}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:#73e1df}.hero h1{font-size:25px;margin:5px 0}.hero p{font-size:14px;color:#dbe5ff;margin:0 0 15px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meta input{min-width:0;padding:11px;border:1px solid #ffffff3d;border-radius:10px;background:#ffffff14;color:white;font-size:16px}.meta input::placeholder{color:#d4def2}.tabs{position:sticky;top:0;z-index:10;display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#ffffffed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.tab{border:0;border-radius:99px;padding:10px 14px;white-space:nowrap;background:#e9eef7;color:#40506b;font-weight:750}.tab.active{background:var(--blue);color:#fff}.main{max-width:850px;margin:auto;padding:14px}.section{display:none}.section.active{display:block}.section-title{display:flex;align-items:center;gap:11px;margin-bottom:12px}.icon{width:44px;height:44px;border-radius:13px;background:var(--nav);color:white;display:grid;place-items:center;font-weight:900;font-size:20px}.section-title h2{margin:0;font-size:23px}.progress{background:white;border:1px solid var(--line);padding:11px;border-radius:13px;margin-bottom:12px}.prow{display:flex;justify-content:space-between;font-size:13px;font-weight:750}.bar{height:6px;background:#e9edf4;border-radius:20px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0}.group{background:white;border:1px solid var(--line);border-radius:16px;margin:0 0 13px;overflow:hidden;box-shadow:0 4px 14px #15234708}.ghead{padding:14px 15px;background:#f9fbfe;border-bottom:1px solid var(--line)}.ghead h3{margin:0;font-size:17px}.ghead p{font-size:13px;color:var(--muted);margin:5px 0 0;font-style:italic}.question{padding:14px 15px;border-bottom:1px solid #edf0f5}.question:last-child{border-bottom:0}.qtext{font-weight:650;line-height:1.38}.question textarea{width:100%;min-height:92px;margin-top:10px;border:1px solid #ccd5e3;border-radius:11px;padding:11px;font:16px/1.4 inherit;background:#fcfdff;resize:vertical}.question textarea:focus{outline:3px solid #2856d820;border-color:var(--blue)}.actions{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#fffffff0;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.actions button,.exportMenu button{border:0;border-radius:11px;padding:12px 14px;font-weight:750;background:#e9eef7;color:var(--nav)}.actions .primary{background:var(--blue);color:white}.exportMenu{display:none;position:fixed;right:12px;bottom:84px;z-index:30;background:white;padding:7px;border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 30px #17213b33}.exportMenu.show{display:grid;gap:4px}.exportMenu button{text-align:left;background:white}.note{font-size:12px;color:var(--muted);text-align:center;margin:16px 4px}@media(max-width:520px){.meta{grid-template-columns:1fr}.main{padding:12px}.actions span{display:none}}@media print{body{background:white;padding:0}.hero{background:white!important;color:black;padding:10px 0}.hero p,.eyebrow{color:#555}.tabs,.actions,.exportMenu{display:none!important}.main{max-width:none;padding:0}.section{display:block!important;page-break-before:always}.section:first-child{page-break-before:auto}.progress{display:none}.group{box-shadow:none;break-inside:auto}.question{break-inside:avoid}.question textarea{border:0;min-height:70px;padding:3px}.note{display:none}}
</style></head><body><header class="hero"><div class="eyebrow">LUCI-FLOW · INTRALOGISTICS</div><h1>Customer Meeting Guidelines</h1><p>Questionnaire d’entretien commercial et technique</p><div class="meta"><input id="client" placeholder="Client / société"><input id="site" placeholder="Site"><input id="contact" placeholder="Interlocuteur"><input id="date" type="date"></div></header><nav id="tabs" class="tabs"></nav><main id="app" class="main"></main><div id="exportMenu" class="exportMenu"><button onclick="window.print()">Exporter en PDF</button><button onclick="exportJson()">Exporter la sauvegarde</button><button onclick="document.getElementById('importFile').click()">Importer une sauvegarde</button><button style="color:#b42318" onclick="resetAll()">Réinitialiser</button></div><input id="importFile" type="file" accept="application/json" hidden><footer class="actions"><button onclick="move(-1)">← <span>Précédent</span></button><button class="primary" onclick="move(1)"><span>Suivant</span> →</button><button onclick="menu()">Exporter ⋯</button></footer><script>
const sections=[{"id": "commercial", "title": "Commercial", "icon": "€", "groups": [{"title": "Introduction", "intro": "", "questions": ["Quel est le caillou dans la chaussure ?", "Quels sont les enjeux à surmonter ?"]}, {"title": "M - Metrics", "intro": "Quels sont les indicateurs économiques clés pour le prospect ?", "questions": ["Quels sont vos objectifs financiers prioritaires ?", "Quels indicateurs clés de performance (KPI) permettent de mesurer la réussite (par exemple, délai de traitement des commandes, productivité de la préparation des commandes, précision des stocks) ?", "Quels sont les trois principaux résultats attendus (capacité, productivité, niveau de service, réduction des coûts) ?"]}, {"title": "E - Economic Buyer", "intro": "Qui est le décisionnaire final ayant l’autorité sur le budget ?", "questions": ["Qui valide les décisions budgétaires dans votre organisation ?", "Est-ce le bon moment pour impliquer cette personne dans nos discussions ?", "Quelles sont les attentes en matière de retour sur investissement (délais, économies) ?", "Quels sont les principaux facteurs de coût (main-d'œuvre, espace, erreurs) ?", "Que comprend le périmètre du projet (bâtiment, équipement, informatique, intégration) ?", "Comment se passe le processus de décision ?"]}, {"title": "D - Decision Criteria", "intro": "Quels critères influencent le choix du client ?", "questions": ["Quels critères influencent votre décision finale ?", "Comment évaluez-vous les solutions concurrentes ?", "Quels sont les concurrents impliqués dans ce projet ?"]}, {"title": "D - Decision Process", "intro": "Comment le processus de décision est-il structuré ?", "questions": ["Quelles sont les étapes nécessaires avant de valider un contrat ?", "Quels sont les délais typiques pour ce type de projet dans votre organisation ?", "Quelle est la date de mise en service prévue ?", "Quelles sont les étapes clés (conception, validation, mise en œuvre) ?", "Y a-t-il des contraintes de calendrier (périodes de forte activité, disponibilité du site) ?", "Quand la décision d'investissement est-elle attendue ?"]}, {"title": "I - Identify Pain", "intro": "Quels problèmes spécifiques votre solution résout-elle ?", "questions": ["Quels défis opérationnels rencontrez-vous actuellement ?", "Pourquoi lancer ce projet aujourd’hui ?", "Comment ces défis impactent-ils vos objectifs stratégiques ?", "Quels sont les systèmes d'automatisation actuellement installés (par exemple, convoyeurs, AMR, système « marchandises vers l'homme ») ?", "Quelles sont leurs performances et leur taux d'utilisation ?", "Ces systèmes doivent-ils être réutilisés, modernisés ou remplacés ?", "Existe-t-il des problèmes ou des limites connus ?"]}, {"title": "C - Champion", "intro": "Qui est votre allié en interne pour promouvoir votre offre ?", "questions": ["Qui dans votre organisation pourrait défendre cette solution en interne ?", "Avec qui devrais-je travailler pour faciliter le processus de décision ?"]}, {"title": "C - Competition", "intro": "Qui est votre principal concurrent ?", "questions": ["Quelles sont les entreprises impliquées dans ce projet ?"]}]}, {"id": "technique", "title": "Technique", "icon": "⚙", "groups": [{"title": "Profil des produits", "intro": "", "questions": ["Item master data : dimensions, poids, emballage, catégories ABC ?", "Quelles sont les caractéristiques des produits : dimensions (L/l/H), poids, types d’emballage (palette, carton, unité) ?", "Quelle est la répartition ABC (rotation rapide vs lente) ?"]}, {"title": "Volume de commande", "intro": "", "questions": ["Quels sont vos volumes moyens et de pointe actuels : commandes/jour, lignes de commande/jour, unités/jour ?", "Quelles sont les périodes de pointe (saisonnalité, promotions) ?", "Quel est le niveau de service requis (livraison le jour même, le lendemain, heures limites) ?", "Quel est le nombre total de références ?", "Quel est le niveau des stocks (moyen et de pointe) ?", "Quelle est la couverture des stocks (en jours/semaines) ?"]}, {"title": "Préparation : palettes, colis, pièce", "intro": "", "questions": ["Quelles sont les méthodes de préparation des commandes utilisées aujourd’hui (palette, carton, pièce) ?", "Quelle est la part de chaque type de préparation ?", "Comment les commandes sont-elles actuellement préparées (manuellement, de manière assistée, automatiquement) ?", "Quelles sont les principales sources d’inefficacité dans la préparation des commandes (temps de déplacement, erreurs, main-d’œuvre) ?", "Quel niveau d’automatisation est visé (assistance ou automatisation complète) ?"]}, {"title": "Inbound flows", "intro": "", "questions": ["Volumes (palettes/jour) ?", "Sources (usine, fournisseurs) ?"]}, {"title": "Outbound flows", "intro": "", "questions": ["Canaux de distribution (magasins, commerce en ligne, exportation) ?", "Quels sont les pics de trafic entrants/sortants ?", "Y a-t-il des opérations de transbordement ou des flux urgents ?", "Quels sont les goulots d'étranglement actuels au niveau de la réception ou de l'expédition ?"]}, {"title": "Système de gestion d'entrepôt (WMS) actuel", "intro": "", "questions": ["Quel système WMS est actuellement utilisé (version, niveau de personnalisation) ?", "Quel est le niveau de stabilité et d'évolutivité du système ?", "Quelles interfaces existent déjà (ERP, TMS, automatisation) ?", "Avez-vous déjà utilisé des systèmes WCS/WES ?", "Quelles sont les contraintes informatiques ou les considérations relatives à la feuille de route ?"]}]}, {"id": "next", "title": "Prochaines étapes", "icon": "✓", "groups": [{"title": "Pouvez-vous nous fournir :", "intro": "", "questions": ["Les données de référence des articles (dimensions, poids) ?", "L'historique des commandes (au moins 12 mois) ?", "Des instantanés des stocks ?", "Le plan des locaux (DWG) ?", "La documentation des processus / les organigrammes ?"]}, {"title": "Quand devrions-nous :", "intro": "", "questions": ["Planifier des ateliers de conception détaillée ?", "Organiser une visite du site et une validation ?", "Confirmer les responsabilités et le calendrier relatifs à la collecte des données ?"]}]}], meta=['client','site','contact','date'];let active=0;const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);function k(si,gi,qi){return`cmg_${si}_${gi}_${qi}`}function render(){sections.forEach((s,si)=>{let b=document.createElement('button');b.className='tab'+(si?'':' active');b.textContent=s.title;b.onclick=()=>show(si);$('#tabs').appendChild(b);let total=s.groups.reduce((n,g)=>n+g.questions.length,0),el=document.createElement('section');el.className='section'+(si?'':' active');el.innerHTML=`<div class="section-title"><div class="icon">${s.icon}</div><h2>${s.title}</h2></div><div class="progress"><div class="prow"><span>Questions renseignées</span><span id="count${si}">0 / ${total}</span></div><div class="bar"><i id="bar${si}"></i></div></div>`+s.groups.map((g,gi)=>`<article class="group"><header class="ghead"><h3>${g.title}</h3>${g.intro?`<p>${g.intro}</p>`:''}</header>${g.questions.map((q,qi)=>`<div class="question"><div class="qtext">${q}</div><textarea data-si="${si}" data-gi="${gi}" data-qi="${qi}" placeholder="Notes et réponse du client…"></textarea></div>`).join('')}</article>`).join('')+(si===2?'<div class="note">Propriété de LUCI-Flow · Ne peut être reproduit ou communiqué sans accord écrit.</div>':'');$('#app').appendChild(el)});load()}function show(i){active=Math.max(0,Math.min(i,sections.length-1));$$('.tab').forEach((e,j)=>e.classList.toggle('active',j===active));$$('.section').forEach((e,j)=>e.classList.toggle('active',j===active));$$('.tab')[active].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});scrollTo({top:$('.tabs').offsetTop,behavior:'smooth'})}function move(n){show(active+n)}function save(){meta.forEach(x=>localStorage.setItem('cmg_'+x,$('#'+x).value));$$('textarea').forEach(t=>localStorage.setItem(k(t.dataset.si,t.dataset.gi,t.dataset.qi),t.value));progress()}function load(){meta.forEach(x=>$('#'+x).value=localStorage.getItem('cmg_'+x)||'');$$('textarea').forEach(t=>t.value=localStorage.getItem(k(t.dataset.si,t.dataset.gi,t.dataset.qi))||'');$$('input,textarea').forEach(e=>e.addEventListener('input',save));progress()}function progress(){sections.forEach((s,si)=>{let all=[...$$(`textarea[data-si="${si}"]`)],n=all.filter(x=>x.value.trim()).length;$('#count'+si).textContent=`${n} / ${all.length}`;$('#bar'+si).style.width=(all.length?n/all.length*100:0)+'%'})}function payload(){return{version:1,exportedAt:new Date().toISOString(),meta:Object.fromEntries(meta.map(x=>[x,$('#'+x).value])),answers:[...$$('textarea')].map(t=>({section:+t.dataset.si,group:+t.dataset.gi,question:+t.dataset.qi,answer:t.value}))}}function exportJson(){let d=payload(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download=`Customer_Meeting_${d.meta.client||'Client'}_${d.meta.date||'Entretien'}.json`;a.click();URL.revokeObjectURL(a.href);menu()}function menu(){$('#exportMenu').classList.toggle('show')}$('#importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());meta.forEach(x=>$('#'+x).value=d.meta?.[x]||'');d.answers?.forEach(a=>{let t=$(`textarea[data-si="${a.section}"][data-gi="${a.group}"][data-qi="${a.question}"]`);if(t)t.value=a.answer||''});save()}catch(_){alert('Fichier de sauvegarde invalide')}e.target.value=''};function resetAll(){if(confirm('Effacer toutes les réponses ?')){Object.keys(localStorage).filter(x=>x.startsWith('cmg_')).forEach(x=>localStorage.removeItem(x));location.reload()}}render();
</script></body></html>
